name: Verify desktop
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx imago-check
      - name: Restore the Playwright browser
        id: browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Save the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser.outputs.cache-primary-key }}
      - run: npm run build && npm test && npm run smoke
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cargo cache key
        id: cargo-key
        shell: bash
        run: |
          info=$(rustc -vV)
          release=$(printf '%s\n' "$info" | sed -n 's/^release: //p')
          commit=$(printf '%s\n' "$info" | sed -n 's/^commit-hash: \(.........\).*/\1/p')
          lock=$(grep -E '^(source|checksum) = ' Cargo.lock | shasum -a 256 | cut -c1-20)
          echo "toolchain=$release-$commit" >> "$GITHUB_OUTPUT"
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
      - name: Restore the compiled Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-native-${{ steps.cargo-key.outputs.toolchain }}-${{ steps.cargo-key.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-${{ steps.cargo-key.outputs.toolchain }}-
      - name: Install WebKitGTK and virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth
      - run: npm ci && npm run build
      - name: Add readiness probe to the CI frontend
        run: |
          cp apps/desktop/tests/native-launch.mjs apps/desktop/dist/native-launch.js
          node --input-type=module -e "import fs from 'node:fs'; const p='apps/desktop/dist/index.html'; fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('</body>','<script type=module src=./native-launch.js></script></body>'))"
      - run: cargo test --locked -p mukade-desktop
      - run: cargo test --locked -p mukade --lib --test chat_connect
      - run: cargo build --locked -p mukade-desktop --features custom-protocol
      - name: Start embedded Linux frontend
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 .github/scripts/native-launch.py target/debug/mukade-ui
      - name: Start embedded macOS frontend
        if: runner.os == 'macOS'
        run: python3 .github/scripts/native-launch.py target/debug/mukade-ui
