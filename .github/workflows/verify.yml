name: Verify desktop
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Imago's check (the pins of the package and the crate, the icons, the agent files, the names the package removed, the parts the shell
      # draws) and Sigrid's, with the rule own-class (sigrid-check.config.json): no class, style or stylesheet of the app's own.
      - run: npx imago-check
      - run: npx --no sigrid-check apps/desktop/src
      - name: Restore the Playwright browser
        id: browser
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Save the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser.outputs.cache-primary-key }}
      - run: npm run build && npm test && npm run smoke
  native:
    strategy:
      fail-fast: false
      matrix:
        # Windows too: releases are Windows-only, and its cfg(windows) code and tests compile nowhere else before main.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # The first Windows run builds tauri and every test binary with no cache.
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cargo cache key
        id: cargo-key
        shell: bash
        run: |
          info=$(rustc -vV)
          release=$(printf '%s\n' "$info" | sed -n 's/^release: //p')
          commit=$(printf '%s\n' "$info" | sed -n 's/^commit-hash: \(.........\).*/\1/p')
          lock=$(grep -E '^(source|checksum) = ' Cargo.lock | sha256sum | cut -c1-20)
          echo "toolchain=$release-$commit" >> "$GITHUB_OUTPUT"
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
      - name: Restore the compiled Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-native-${{ steps.cargo-key.outputs.toolchain }}-${{ steps.cargo-key.outputs.lock }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-${{ steps.cargo-key.outputs.toolchain }}-
      - name: Install WebKitGTK and virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth
      - name: Point embed-resource at the Windows SDK's rc.exe
        # build-release.bat's :find_rc: the SDK's own lookup can name an rc.exe that is not there.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\rc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($rc) { "RC_x86_64_pc_windows_msvc=$($rc.FullName)" >> $env:GITHUB_ENV; Write-Host "rc.exe: $($rc.FullName)" }
      - run: npm ci && npm run build
      - name: Add readiness probe to the CI frontend
        shell: bash
        run: |
          cp apps/desktop/tests/native-launch.mjs apps/desktop/dist/native-launch.js
          node --input-type=module -e "import fs from 'node:fs'; const p='apps/desktop/dist/index.html'; fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('</body>','<script type=module src=./native-launch.js></script></body>'))"
      - run: cargo test --locked -p mukade-desktop
      # Every test of the library and the CLI: the unit tests, all of tests/ and the doc tests. The live ones are #[ignore].
      - run: cargo test --locked -p mukade
      # The command line the tests above built, for local tests that drive a prebuilt mukade (gh run download).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mukade-${{ runner.os }}
          path: target/debug/mukade${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14
      - run: cargo build --locked -p mukade-desktop --features custom-protocol
      - name: Start embedded Linux frontend
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 .github/scripts/native-launch.py target/debug/mukade-ui
