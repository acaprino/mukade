name: Verify desktop
# One run per commit: develop is verified when it is pushed, and the pull request develop -> main (the same commit)
# shows the checks of that run. A pull request into develop is another commit and is verified too.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      # The browser Playwright downloads is kept between runs: the install below still runs, adds the system
      # libraries and downloads only what the restored folder lacks.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci
      - run: npx imago-check
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm test && npm run smoke
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      # The build of the dependencies (registry, git dependencies, target/) is restored from the last run and cargo
      # compiles only what changed. The key carries the compiler: a cache made by another rustc is rebuilt whole
      # and, being a hit on the same lock, would never be saved again. Saved once per key, by a run that succeeds.
      - name: Cargo home and compiler
        id: rust
        run: |
          echo "home=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.rust.outputs.home }}/registry/index
            ${{ steps.rust.outputs.home }}/registry/cache
            ${{ steps.rust.outputs.home }}/git/db
            target
          key: ${{ runner.os }}-cargo-native-${{ steps.rust.outputs.rustc }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-${{ steps.rust.outputs.rustc }}-
      - name: Install WebKitGTK and virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xauth
      - run: npm ci && npm run build
      - name: Add readiness probe to the CI frontend
        run: |
          cp apps/desktop/tests/native-launch.mjs apps/desktop/dist/native-launch.js
          node --input-type=module -e "import fs from 'node:fs'; const p='apps/desktop/dist/index.html'; fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('</body>','<script type=module src=./native-launch.js></script></body>'))"
      - run: cargo test --locked -p mukade-desktop
      - run: cargo test --locked -p mukade --lib --test chat_connect
      - run: cargo build --locked -p mukade-desktop --features custom-protocol
      - name: Start embedded Linux frontend
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 .github/scripts/native-launch.py target/debug/mukade-ui
      - name: Start embedded macOS frontend
        if: runner.os == 'macOS'
        run: python3 .github/scripts/native-launch.py target/debug/mukade-ui
