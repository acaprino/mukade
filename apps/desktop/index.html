<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light"><link rel="icon" href="data:,">
  <title>Mukade</title>
</head>
<body>
  <svg hidden aria-hidden="true">
    <symbol id="i-mark" viewBox="0 0 18 18"><path d="M1 13q4-1 5.500-5T11 4l5-2"/><path d="M5 9 3.500 11.500M8 6.500 6.500 9M11 4.500 9.500 7M14 3 12.500 5.500"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.500 13.500v-11h5l1.500 2h6.500v9z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 16 16"><path d="M2 2.500h12v8H8l-3.500 3v-3H2z"/></symbol>
    <symbol id="i-list" viewBox="0 0 16 16"><path d="M2.500 3.500h11v9h-11zM2.500 7h11M6 3.500v9"/></symbol>
    <symbol id="i-hop" viewBox="0 0 16 16"><path d="M2 5.500h11M10.500 3 13 5.500 10.500 8M14 10.500H3M5.500 8 3 10.500 5.500 13"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.500 3v10l8-5z"/></symbol>
    <symbol id="i-export" viewBox="0 0 16 16"><path d="M8 10.500v-8M5 5.500l3-3 3 3M2.500 10v3.500h11V10"/></symbol>
    <symbol id="i-import" viewBox="0 0 16 16"><path d="M8 2.500v8M5 7.500l3 3 3-3M2.500 10v3.500h11V10"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.500-3.500M13 2.500v3h-3"/></symbol>
    <symbol id="i-theme" viewBox="0 0 16 16"><path d="M8 2.500v11M8 2.500a5.500 5.500 0 1 0 0 11"/></symbol>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></symbol>
    <symbol id="i-caret" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4"/></symbol>
    <symbol id="i-fork" viewBox="0 0 16 16"><path d="M4 2v3q0 3 4 3t4-3V2M8 8v6"/></symbol>
  </svg>
  <main id="app">
    <header class="titlebar">
      <div class="titlebar-drag" data-tauri-drag-region>
        <svg class="brand-mark icon" aria-hidden="true"><use href="#i-mark"/></svg>
        <svg class="wordmark" viewBox="0 0 89 10" role="img" aria-label="Mukade">
          <path d="M.8 10V1L7 7l6.2-6v9"/>
          <path transform="translate(17)" d="M.8 0v8.2l1 1h8.4l1-1V0"/>
          <path transform="translate(32)" d="M.8 0v10M11.2 0 .8 5l10.4 5"/>
          <path transform="translate(47)" d="m.5 10 5.500-9.400 5.500 9.400M2.600 6.600h6.800"/>
          <path transform="translate(62)" d="M.8.800h8.400l2 2v4.400l-2 2H.8z"/>
          <path transform="translate(77)" d="M11.200.800H.8v8.400h10.400M.8 5h8.400"/>
        </svg><span class="version" id="version"></span>
        <span class="title-description">harness sessions</span>
      </div>
      <div class="window-controls" role="group" aria-label="Window controls">
        <button id="window-minimize" type="button" aria-label="Minimize window" title="Minimize" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.500h10"/></svg>
        </button>
        <button id="window-maximize" type="button" aria-label="Maximize window" title="Maximize" disabled>
          <svg class="maximize-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.500" y="3.500" width="9" height="9"/></svg>
          <svg class="restore-icon" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M5.500 5.500v-3h8v8h-3"/><rect x="2.500" y="5.500" width="8" height="8"/></svg>
        </button>
        <button id="window-close" type="button" aria-label="Close window" title="Close" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </header>
    <nav class="toolbar" aria-label="Views and commands">
      <div class="tabs" role="tablist" aria-label="Views">
        <button type="button" role="tab" id="tab-sessions" aria-selected="true" data-view="sessions"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>Sessions</button>
        <button type="button" role="tab" id="tab-chat" aria-selected="false" data-view="chat"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg>Chat <kbd>c</kbd></button>
      </div>
      <span class="toolbar-divider"></span>
      <input type="search" id="search" aria-label="Filter sessions" placeholder="Filter by title, id, folder   /" autocomplete="off" spellcheck="false">
      <span class="spring"></span>
      <button type="button" id="scan" title="Look for portable or custom installations in a folder"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>Scan folder <kbd>o</kbd></button>
      <button type="button" id="import" title="Write a dump document into an installation"><svg class="icon" aria-hidden="true"><use href="#i-import"/></svg>Import <kbd>i</kbd></button>
      <button type="button" id="reload" title="Read every store again"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>Reload <kbd>r</kbd></button>
      <button type="button" id="theme" title="Theme: follows the system" aria-label="Theme"><svg class="icon" aria-hidden="true"><use href="#i-theme"/></svg><span id="theme-name">Auto</span></button>
    </nav>
    <section id="view-sessions" class="view" aria-label="Sessions" data-focus="installations">
      <aside id="installations" class="column" aria-label="Installations and folders"></aside>
      <div class="resizer" id="resize-installations" role="separator" aria-orientation="vertical" aria-label="Resize the installations column" title="Drag to resize · double-click to reset"></div>
      <section id="sessions" class="column" aria-label="Sessions of the installation"></section>
      <div class="resizer" id="resize-sessions" role="separator" aria-orientation="vertical" aria-label="Resize the sessions column" title="Drag to resize · double-click to reset"></div>
      <section id="detail" class="column" aria-label="Session"></section>
      <button type="button" class="back-column" data-back aria-label="Back one column">‹ Back</button>
    </section>
    <section id="view-chat" class="view" aria-label="Chat" hidden></section>
    <footer class="statusbar" id="statusbar"><i></i><span id="status">starting…</span><span id="status-counts" class="muted"></span><span class="spring"></span><span id="status-right" class="hints"></span></footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
