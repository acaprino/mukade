[package]
name = "mukade-desktop"
version = "0.2.0"
edition = "2024"
description = "Desktop app for the harness sessions manager: browse, hop, export, import, resume and read the chat"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mukade-ui"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
mukade = { path = "../../.." }
imago-shell = { git = "https://github.com/acaprino/imago", rev = "12da9f375dbcf84ce443f9b49449c9aa258f3e4b" }
tauri = { version = "2.9", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", features = ["time"] }
