[package]
name = "mukade-desktop"
version = "0.1.0"
edition = "2024"
description = "Desktop app for the harness sessions manager: browse, hop, export, import, resume and read the chat"
license = "MIT"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
mukade = { path = "../../.." }
tauri = { version = "2.9", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", features = ["time"] }
