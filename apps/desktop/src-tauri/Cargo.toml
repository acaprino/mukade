[package]
name = "mukade-desktop"
version = "0.5.0"
edition = "2024"
description = "Desktop app for the harness sessions manager: browse, hop, export, import, resume and read the chat"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mukade-ui"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
mukade = { path = "../../.." }
# The window the apps of the suite share, as a Tauri plugin: its material and theme, glass, Snap Layouts, the guard, WebView2 recovery,
# its place, the title and the taskbar. The tag is the one @acaprino/imago has in package.json; the crate pins tauri to 2.12.5.
imago-shell = { git = "https://github.com/acaprino/imago", tag = "v1.2.0" }
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", features = ["time"] }
