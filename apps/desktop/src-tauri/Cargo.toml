[package]
name = "mukade-desktop"
version = "0.1.0"
edition = "2024"
description = "Desktop app for the harness sessions manager: browse, hop, export, import, resume and read the chat"
license = "MIT"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
mukade = { path = "../../.." }
tauri = { version = "2.9", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
