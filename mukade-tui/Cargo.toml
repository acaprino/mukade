[package]
name = "mukade-tui"
version = "0.1.0"
edition = "2024"
description = "A small native terminal browser for Mukade sessions"
license = "MIT"
build = "build.rs"

[dependencies]
mukade = { path = ".." }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"
serde_json = "1"

# The Windows icon is the Musashi Terminal one (horness-launcher `res/musashi-terminal.ico`).
[build-dependencies]
embed-resource = "3"
