<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mukade · TUI mockup</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #0f131a;
    --panel-2: #121821;
    --line: #232b38;
    --line-soft: #1a212c;
    --text: #c9d1d9;
    --muted: #6e7681;
    --dim: #8b949e;
    --green: #7ee787;
    --blue: #79c0ff;
    --yellow: #e3b341;
    --red: #ff7b72;
    --purple: #d2a8ff;
    --accent: #7ee787;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 50% -10%, #111824 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Cascadia Code", "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
    display: grid;
    place-items: center;
    padding: 22px;
  }
  .terminal {
    width: min(1180px, 100%);
    height: min(760px, calc(100vh - 44px));
    min-height: 620px;
    background: linear-gradient(180deg, #0d1117 0%, #0b0f15 100%);
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .titlebar {
    height: 42px;
    flex: 0 0 42px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: #0c1016;
  }
  .dots { display: flex; gap: 6px; }
  .dots i {
    width: 9px; height: 9px; border-radius: 50%;
    background: #2b3441; display: block;
  }
  .dots i:first-child { background: #3d4655; }
  .brand { color: #e6edf3; font-weight: 700; letter-spacing: .02em; }
  .brand span { color: var(--green); }
  .crumb { color: var(--muted); }
  .titlebar .right { margin-left: auto; color: var(--muted); font-size: 12px; }
  .summary {
    flex: 0 0 auto;
    display: flex;
    gap: 18px;
    align-items: center;
    padding: 11px 18px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--dim);
    font-size: 12px;
    background: #0b0f15;
  }
  .summary b { color: var(--text); font-weight: 600; }
  .summary .sep { color: #303a48; }
  .summary .scan { margin-left: auto; color: var(--muted); }
  .view {
    flex: 1 1 auto;
    overflow: auto;
    padding: 14px 18px 10px;
  }
  .keybar {
    flex: 0 0 auto;
    min-height: 36px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 7px 18px;
    border-top: 1px solid var(--line);
    background: #0c1016;
    color: var(--muted);
    font-size: 11.5px;
    flex-wrap: wrap;
  }
  .keybar b { color: var(--text); font-weight: 600; }
  .keybar .status { margin-left: auto; color: var(--green); }
  .section-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin: 2px 0 8px;
  }
  .section-title .hint { letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 11px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    color: var(--muted);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    padding: 5px 8px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--line-soft);
    white-space: nowrap;
    color: var(--text);
    font-size: 12.5px;
  }
  tr { cursor: pointer; }
  tbody tr:hover td { background: #10161f; }
  tbody tr.selected td { background: #151d28; }
  tbody tr.selected td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .ok { background: var(--green); box-shadow: 0 0 8px rgba(126,231,135,.35); }
  .warn { background: var(--yellow); }
  .off { background: #3d4655; }
  .hname { color: #e6edf3; font-weight: 600; }
  .mono { font-variant-ligatures: none; }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .green { color: var(--green); }
  .blue { color: var(--blue); }
  .yellow { color: var(--yellow); }
  .red { color: var(--red); }
  .purple { color: var(--purple); }
  .tiny { font-size: 11px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .right { text-align: right; }
  .badge {
    display: inline-block;
    padding: 0 6px;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--dim);
    font-size: 10.5px;
    line-height: 1.5;
    vertical-align: 1px;
  }
  .badge.fork { color: var(--blue); border-color: #1f3a56; background: #0d1722; }
  .badge.arch { color: var(--yellow); border-color: #3a2f14; background: #1a160a; }
  .badge.via { color: var(--green); border-color: #1f3a2a; background: #0c1712; }
  .badge.via.alt { color: var(--purple); border-color: #32244a; background: #150f1d; }
  .badge.via.none { color: var(--red); border-color: #451f1d; background: #1b0f0e; }
  .search { display: inline-flex; align-items: center; gap: 6px; }
  .search input {
    background: #0f141c;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    outline: none;
    padding: 2px 6px;
    width: 210px;
  }
  .search input:focus { border-color: #2b4a33; box-shadow: 0 0 0 1px #1f3d26; }
  .cmd { color: var(--dim); font-size: 11.5px; }
  .detail-body .value.wrap { white-space: normal; overflow: visible; text-overflow: clip; }
  .tabs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin: 0 0 10px; }
  .tab {
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 4px;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); background: #111823; }
  .tab.active { color: #e6edf3; background: #161e29; border-color: var(--line); }
  .tab .n { color: var(--muted); margin-left: 5px; font-size: 11px; }
  .tab.active .n { color: var(--green); }
  .detail {
    margin-top: 12px;
    border: 1px solid var(--line);
    background: #0b1017;
  }
  .detail-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .detail-body { padding: 10px 12px 11px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 2px 28px; }
  .detail-body .field { display: flex; gap: 10px; min-width: 0; }
  .detail-body .label { flex: 0 0 72px; color: var(--muted); font-size: 11.5px; }
  .detail-body .value { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-title { color: #e6edf3; font-weight: 600; font-size: 13.5px; }
  .detail-actions { grid-column: 1 / -1; margin-top: 8px; color: var(--muted); font-size: 11.5px; }
  .detail-actions b { color: var(--text); font-weight: 600; }
  .tree { padding: 8px 2px 2px; }
  .tree-row {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) 118px 96px;
    align-items: center;
    gap: 0 10px;
    padding: 6px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12.5px;
  }
  .tree-row:hover { background: #10161f; }
  .tree-row.selected { background: #151d28; box-shadow: inset 2px 0 0 var(--accent); }
  .tree-glyph { color: #39424f; }
  .tree-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-name .id { color: var(--muted); margin-left: 8px; font-size: 11px; }
  .tree-row.selected .tree-name .id { color: var(--blue); }
  .tree-state { color: var(--muted); font-size: 11.5px; }
  .tree-time { color: var(--muted); font-size: 11.5px; text-align: right; }
  .note {
    margin-top: 10px;
    padding: 8px 11px;
    border-left: 2px solid #2b3d2e;
    background: #0d1410;
    color: var(--dim);
    font-size: 11.5px;
  }
  .note b { color: var(--green); font-weight: 600; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(4,6,9,.66);
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .modal {
    width: min(620px, 100%);
    background: #0d1219;
    border: 1px solid #2b3544;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
  }
  .modal-head { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
  .modal-body { padding: 12px; }
  .modal-row { display: flex; gap: 12px; padding: 4px 0; font-size: 12.5px; }
  .modal-row .label { flex: 0 0 86px; color: var(--muted); }
  .dest { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
  .dest:hover { background: #111823; }
  .dest.active { background: #121c26; border-color: #233a4e; }
  .radio { width: 11px; height: 11px; border: 1px solid #4b5563; border-radius: 50%; display: inline-block; }
  .dest.active .radio { border-color: var(--green); box-shadow: inset 0 0 0 2px #0d1219, inset 0 0 0 6px var(--green); }
  .modal-foot { padding: 9px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; display: flex; gap: 16px; }
  .modal-foot b { color: var(--text); font-weight: 600; }
  .placeholder { color: var(--muted); padding: 26px 8px; text-align: center; }
  ::selection { background: #1f6feb55; }
  @media (max-width: 900px) {
    body { padding: 0; }
    .terminal { width: 100%; height: 100vh; min-height: 0; border: 0; border-radius: 0; }
    .detail-body { grid-template-columns: 1fr; }
    .titlebar .right { display: none; }
  }
</style>
</head>
<body>
<div class="terminal" id="terminal">
  <div class="titlebar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="brand">mukade<span>.</span></div>
    <div class="crumb" id="crumb">/ harnesses</div>
    <div class="right" id="clock">scan 0.42s · 2026-10-30 14:32</div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="view" id="view"></div>
  <div class="keybar" id="keybar"></div>
</div>

<script>
const harnesses = [
  {
    id: "claude_code", label: "claude_code", name: "Claude Code", version: "2.1.311",
    binary: "~/.local/bin/claude", resolved: "PATH", store: "~/.claude", storeEnv: "CLAUDE_CONFIG_DIR", exeEnv: "MUKADE_CLAUDE_EXE",
    sessions: 128, forks: null, state: "ready",
    lineage: "not recorded",
    last: "2m ago",
    evidence: ["projects/*/*.jsonl · 128 session files", "subagents/ subfolders"]
  },
  {
    id: "codex", label: "codex", name: "Codex CLI", version: "0.164.0",
    binary: "%LOCALAPPDATA%\\Programs\\OpenAI\\Codex\\bin\\codex.exe", resolved: "well-known install location",
    store: "~/.codex", storeEnv: "CODEX_HOME", exeEnv: "MUKADE_CODEX_EXE",
    sessions: 64, forks: null, state: "ready",
    lineage: "not recorded",
    last: "18m ago",
    evidence: ["sessions/**/rollout-*.jsonl · 64 files", "session_index.jsonl"]
  },
  {
    id: "opencode", label: "opencode", name: "OpenCode", version: "2.0.24",
    binary: "%APPDATA%\\npm\\opencode.cmd", resolved: "PATH",
    store: "~/.local/share/opencode/opencode.db", storeEnv: "OPENCODE_DB", exeEnv: "MUKADE_OPENCODE_EXE",
    sessions: 21, forks: 5, state: "ready",
    lineage: "parent_id + fork_session_id",
    last: "2m ago",
    evidence: ["opencode.db · session_v2 rows"]
  },
  {
    id: "pi", label: "pi", name: "Pi", version: "1.4.0",
    binary: "%APPDATA%\\npm\\pi.cmd", resolved: "PATH",
    store: "~/.pi/agent", storeEnv: "PI_CODING_AGENT_DIR", exeEnv: "MUKADE_PI_EXE",
    sessions: 6, forks: 2, state: "ready",
    lineage: "header.parentSession",
    last: "1h ago",
    evidence: ["sessions/--*--/*.jsonl · 6 files", "models.json"]
  }
];

const sessions = [
  {
    id: "ses_7Kp2mQ9r", short: "ses_7Kp2…", harness: "opencode",
    title: "Refactor auth middleware", state: "idle", stateTone: "dim",
    updated: "2m ago", model: "anthropic/claude-sonnet-4",
    parent: "ses_9f2cLd41", parentTitle: "Auth spike", boundary: "msg #18",
    children: [
      { id: "ses_a1F7", title: "Retry flow", state: "active", updated: "12m ago" },
      { id: "ses_b7C2", title: "JWT cleanup", state: "idle", updated: "3h ago" }
    ],
    msgs: 42, size: "1.2 MB", archived: false,
    cwd: "~/work/api"
  },
  {
    id: "ses_9f2cLd41", short: "ses_9f2c…", harness: "opencode",
    title: "Auth spike", state: "idle", stateTone: "dim",
    updated: "2h ago", model: "anthropic/claude-sonnet-4",
    parent: null, parentTitle: null, boundary: null,
    children: [
      { id: "ses_7Kp2", title: "Refactor auth middleware", state: "idle", updated: "2m ago" },
      { id: "ses_c3D9", title: "SSO evaluation", state: "archived", updated: "5d ago" }
    ],
    msgs: 71, size: "2.8 MB", archived: false,
    cwd: "~/work/api"
  },
  {
    id: "c45db7bc-542c-4201", short: "c45db7bc…", harness: "claude_code",
    title: "Debug flaky test", state: "active", stateTone: "green",
    updated: "4m ago", model: "claude-sonnet-4-5",
    parent: null, parentTitle: null, boundary: null,
    children: [], msgs: 18, size: "420 KB", archived: false,
    cwd: "~/work/api"
  },
  {
    id: "019a1840-77d2-7a13", short: "019a1840…", harness: "codex",
    title: "Migrate billing schema", state: "idle", stateTone: "dim",
    updated: "18m ago", model: "gpt-5.1-codex",
    parent: null, parentTitle: null, boundary: null,
    children: [], msgs: 96, size: "3.4 MB", archived: false,
    cwd: "~/work/billing"
  },
  {
    id: "3e8b1c0a-9d77-4e21", short: "3e8b1c0a…", harness: "claude_code",
    title: "Recover interrupted rewrite", state: "interrupted", stateTone: "red",
    updated: "1h ago", model: "claude-opus-4-6",
    parent: null, parentTitle: null, boundary: null,
    children: [], msgs: 27, size: "780 KB", archived: false,
    cwd: "~/work/portal"
  },
  {
    id: "ses_c3D9xT82", short: "ses_c3D9…", harness: "opencode",
    title: "SSO evaluation", state: "archived", stateTone: "yellow",
    updated: "5d ago", model: "openai/gpt-5.2",
    parent: "ses_9f2cLd41", parentTitle: "Auth spike", boundary: "msg #52",
    children: [], msgs: 34, size: "910 KB", archived: true,
    cwd: "~/work/api"
  },
  {
    id: "2026-10-28T16-00-00Z_9b2f", short: "2026-10-28…9b2f", harness: "pi",
    title: "Portable session notes", state: "idle", stateTone: "dim",
    updated: "1h ago", model: "anthropic/claude-haiku-4-5",
    parent: "2026-10-21T09-12-00Z_1a77", parentTitle: "Notes cleanup", boundary: "fork before last turn",
    children: [], msgs: 12, size: "88 KB", archived: false,
    cwd: "~/work/notes"
  },
  {
    id: "2026-10-21T09-12-00Z_1a77", short: "2026-10-21…1a77", harness: "pi",
    title: "Notes cleanup", state: "idle", stateTone: "dim",
    updated: "1d ago", model: "anthropic/claude-haiku-4-5",
    parent: null, parentTitle: null, boundary: null,
    children: [
      { id: "2026-10-28", title: "Portable session notes", state: "idle", updated: "1h ago" }
    ], msgs: 19, size: "140 KB", archived: false,
    cwd: "~/work/notes"
  }
];

const totals = {
  supported: harnesses.length,
  installed: harnesses.filter((h) => h.state === "ready").length,
  stores: harnesses.filter((h) => h.sessions > 0).length,
  sessions: harnesses.reduce((n, h) => n + h.sessions, 0),
  forks: harnesses.reduce((n, h) => n + (h.forks || 0), 0)
};
const resumeArgs = {
  claude_code: "claude -p --resume <id>",
  codex: "codex exec resume <id>",
  opencode: "opencode run --standalone --session <id>",
  pi: "pi -p --session <session file>"
};
const state = {
  screen: "harnesses",
  harnessIndex: 2,
  sessionIndex: 0,
  filter: "all",
  query: "",
  filtering: false,
  lineageRoot: "ses_9f2cLd41",
  lineageFocus: "ses_7Kp2mQ9r",
  treeIndex: 1,
  modal: null,
  hopDest: 0,
  status: "ready"
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stateClass = (tone) => tone === "green" ? "green" : tone === "red" ? "red" : tone === "yellow" ? "yellow" : "muted";
const visibleSessions = () => {
  const q = state.query.trim().toLowerCase();
  return sessions.filter((s) =>
    (state.filter === "all" || s.harness === state.filter) &&
    (!q || `${s.title} ${s.id} ${s.harness} ${s.model}`.toLowerCase().includes(q))
  );
};
const selectedSession = () => visibleSessions()[state.sessionIndex] || visibleSessions()[0];

function summary() {
  if (state.screen === "lineage") {
    const s = sessions.find((x) => x.id === state.lineageRoot) || selectedSession();
    return `<span><b>${esc(s.title)}</b></span><span class="sep">·</span><span>${esc(s.harness)}</span><span class="sep">·</span><span>${esc(s.short)}</span><span class="scan">native lineage</span>`;
  }
  const matching = state.query.trim()
    ? `<span class="sep">·</span><span><b>${visibleSessions().length}</b> matching “${esc(state.query.trim())}”</span>`
    : "";
  return `<span><b>${totals.installed}</b> of <b>${totals.supported}</b> harnesses installed</span><span class="sep">·</span><span><b>${totals.stores}</b> stores found</span><span class="sep">·</span><span><b>${totals.sessions}</b> sessions</span><span class="sep">·</span><span><b>${totals.forks}</b> forks linked</span>${matching}<span class="scan">scan 0.42s · 2026-10-30 14:32</span>`;
}

function harnessRows() {
  return harnesses.map((h, i) => {
    const sel = i === state.harnessIndex ? "selected" : "";
    const dot = h.state === "ready" ? "ok" : h.state === "store" ? "warn" : "off";
    const forks = h.forks == null ? `<span class="muted">—</span>` : `<span class="blue">${h.forks}</span>`;
    const via = h.resolved === "PATH"
      ? `<span class="badge via">PATH</span>`
      : `<span class="badge via alt">well-known</span>`;
    return `<tr class="${sel}" data-harness="${i}">
      <td><span class="dot ${dot}"></span><span class="hname">${h.label}</span></td>
      <td class="dim">${h.version}</td>
      <td class="muted">${esc(h.binary)} ${via}</td>
      <td class="muted">${esc(h.store)}</td>
      <td class="num">${h.sessions}</td>
      <td class="num">${forks}</td>
      <td class="dim">${h.state}</td>
    </tr>`;
  }).join("");
}

function renderHarnesses() {
  const h = harnesses[state.harnessIndex];
  $("view").innerHTML = `
    <div class="section-title">detected installations <span class="hint">the supported harnesses, scanned by default · press r to rescan</span></div>
    <table>
      <thead><tr>
        <th>harness</th><th>version</th><th>binary</th><th>store</th>
        <th class="right">sessions</th><th class="right">forks</th><th>state</th>
      </tr></thead>
      <tbody>${harnessRows()}</tbody>
    </table>
    <div class="detail">
      <div class="detail-head">selected harness <span class="muted" style="margin-left:auto;text-transform:none;letter-spacing:0">${esc(h.name)}</span></div>
      <div class="detail-body">
        <div class="field"><span class="label">harness</span><span class="value"><span class="hname">${h.label}</span> <span class="muted">${h.version}</span></span></div>
        <div class="field"><span class="label">last write</span><span class="value dim">${h.last}</span></div>
        <div class="field"><span class="label">binary</span><span class="value muted">${esc(h.binary)}</span></div>
        <div class="field"><span class="label">lineage</span><span class="value ${h.lineage === "not recorded" ? "muted" : "blue"}">${esc(h.lineage)}</span></div>
        <div class="field"><span class="label">store</span><span class="value muted">${esc(h.store)} <span class="dim">· ${esc(h.storeEnv)}</span></span></div>
        <div class="field"><span class="label">state</span><span class="value"><span class="green">●</span> ready · readable</span></div>
        <div class="field"><span class="label">resolved</span><span class="value dim">${esc(h.resolved)} <span class="muted">· override: --${h.id.replace("_code", "")}-exe or ${esc(h.exeEnv)}</span></span></div>
        <div class="field"><span class="label">evidence</span><span class="value muted wrap">${h.evidence.map((e) => esc(e)).join(" · ")}</span></div>
        <div class="detail-actions"><b>enter</b> open sessions · <b>tab</b> next harness · <b>r</b> rescan · <b>?</b> keys</div>
      </div>
    </div>
    <div class="note"><b>Detection is evidence, not a verdict.</b> The four supported harnesses are listed whether or not they are installed; a store is named only when its layout is recognized (session records, <span class="mono">session_index.jsonl</span>, <span class="mono">models.json</span>, <span class="mono">opencode.db</span>). An empty tree, or another harness's SQLite state, is never taken for a store. Claude Code and Codex do not record a cross-session fork parent, so their fork column stays empty.</div>
  `;
  $("crumb").textContent = "/ harnesses";
  $("keybar").innerHTML = `<span><b>j/k</b> move</span><span><b>enter</b> sessions</span><span><b>tab</b> harness</span><span><b>r</b> rescan</span><span><b>q</b> quit</span><span class="status">${esc(state.status)}</span>`;
}

function sessionsViewHtml() {
  const list = visibleSessions();
  if (state.sessionIndex >= list.length) state.sessionIndex = 0;
  const s = list[state.sessionIndex] || list[0];
  if (!s) {
    return `<div class="placeholder">no session matches “${esc(state.query.trim())}” · <b>esc</b> clears the filter</div>`;
  }
  const tabs = ["all", ...harnesses.map((h) => h.id)];
  const rows = list.map((x, i) => {
    const sel = i === state.sessionIndex ? "selected" : "";
    const fork = x.parent
      ? `<span class="badge fork">↳ ${esc(x.parent.slice(0, 8))}…${x.children.length ? ` · ${x.children.length}` : ""}</span>`
      : x.children.length
        ? `<span class="badge fork">fork ×${x.children.length}</span>`
        : `<span class="muted">—</span>`;
    const st = x.archived ? `<span class="badge arch">archived</span>` : `<span class="${stateClass(x.stateTone)}">● ${x.state}</span>`;
    return `<tr class="${sel}" data-session="${i}">
      <td>${st}</td>
      <td class="dim">${x.harness}</td>
      <td>${esc(x.title)}</td>
      <td class="muted">${x.updated}</td>
      <td class="muted">${esc(x.model)}</td>
      <td>${fork}</td>
    </tr>`;
  }).join("");

  const hasLineage = s.parent || s.children.length;
  const lineage = hasLineage
    ? `<div class="field"><span class="label">parent</span><span class="value">${s.parent ? `<span class="blue">↳ ${esc(s.parent)}</span> <span class="dim">“${esc(s.parentTitle)}” · ${esc(s.boundary)}</span>` : `<span class="muted">root session</span>`}</span></div>
       <div class="field"><span class="label">children</span><span class="value">${s.children.length ? `<span class="blue">${s.children.length}</span> <span class="dim">${s.children.map((c) => esc(c.title)).join(" · ")}</span>` : `<span class="muted">none</span>`}</span></div>`
    : `<div class="field"><span class="label">lineage</span><span class="value muted">not recorded by ${s.harness}${s.harness === "claude_code" ? " (--fork-session writes no parent)" : ""}</span></div>
       <div class="field"><span class="label">children</span><span class="value muted">unknown</span></div>`;

  return `
    <div class="tabs">
      ${tabs.map((t) => {
        const active = state.filter === t ? "active" : "";
        const n = t === "all" ? sessions.length : sessions.filter((x) => x.harness === t).length;
        return `<button class="tab ${active}" data-filter="${t}">${t === "all" ? "all" : t}<span class="n">${n}</span></button>`;
      }).join("")}
      <span class="tab" style="margin-left:auto;border:0;color:var(--muted);cursor:default">showing ${list.length} of ${totals.sessions} · lazy list</span>
    </div>
    <table>
      <thead><tr>
        <th>state</th><th>harness</th><th>title</th><th>updated</th><th>model</th><th>fork</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="detail">
      <div class="detail-head">selected session <span class="muted" style="margin-left:auto;text-transform:none;letter-spacing:0">${esc(s.cwd)}</span></div>
      <div class="detail-body">
        <div class="field"><span class="label">title</span><span class="value detail-title">${esc(s.title)}</span></div>
        <div class="field"><span class="label">id</span><span class="value blue">${esc(s.id)}</span></div>
        <div class="field"><span class="label">harness</span><span class="value dim">${s.harness} · ${harnesses.find((h) => h.id === s.harness).version}</span></div>
        <div class="field"><span class="label">updated</span><span class="value dim">${s.updated} · ${s.msgs} messages · ${s.size}</span></div>
        ${lineage}
        <div class="field"><span class="label">resume</span><span class="value cmd">${esc(resumeArgs[s.harness] || "—")}</span></div>
        <div class="field"><span class="label">store var</span><span class="value muted">${esc((harnesses.find((h) => h.id === s.harness) || {}).storeEnv || "—")} <span class="dim">· set it for a resume run by hand</span></span></div>
        <div class="detail-actions"><b>enter</b> lineage · <b>f</b> fork tree · <b>h</b> hop · <b>d</b> dump · <b>r</b> resume</div>
      </div>
    </div>
  `;
}

function renderSessions() {
  $("view").innerHTML = sessionsViewHtml();
  $("crumb").textContent = "/ sessions" + (state.filter === "all" ? "" : ` / ${state.filter}`);
  $("keybar").innerHTML =
    `<span><b>j/k</b> move</span><span><b>enter</b> lineage</span><span><b>tab</b> harness</span><span><b>h</b> hop</span><span><b>d</b> dump</span><span><b>r</b> resume</span>` +
    (state.filtering
      ? `<span class="search"><b>/</b><input id="q" spellcheck="false" autocomplete="off" value="${esc(state.query)}" placeholder="title, id, harness, model"></span>`
      : `<span><b>/</b> filter</span>`) +
    `<span><b>esc</b> back</span><span class="status">${esc(state.status)}</span>`;
  wireFilter();
}

function wireFilter() {
  const q = $("q");
  if (!q) return;
  q.addEventListener("input", () => {
    state.query = q.value;
    state.sessionIndex = 0;
    $("view").innerHTML = sessionsViewHtml();
    $("summary").innerHTML = summary();
  });
  q.focus();
  q.setSelectionRange(q.value.length, q.value.length);
}

function nodeOf(child) {
  return sessions.find((s) => s.id.startsWith(child.id) || s.title === child.title) || child;
}

function treeRows() {
  const root = sessions.find((s) => s.id === state.lineageRoot) || sessions[0];
  const rows = [{ node: root, glyph: "●", prefix: "", focus: root.id === state.lineageFocus }];
  const walk = (node, prefix) => {
    const kids = node.children || [];
    kids.forEach((child, i) => {
      const last = i === kids.length - 1;
      const n = nodeOf(child);
      rows.push({
        node: n,
        glyph: `${prefix}${last ? "└─" : "├─"}`,
        prefix: `${prefix}${last ? "   " : "│  "}`,
        focus: n.id === state.lineageFocus || (n.title && n.title === state.lineageFocus)
      });
      walk(n, `${prefix}${last ? "   " : "│  "}`);
    });
  };
  walk(root, "");
  return { root, rows };
}

function renderLineage() {
  const { root, rows } = treeRows();
  if (state.treeIndex >= rows.length) state.treeIndex = 0;
  const body = rows.map((r, i) => {
    const n = r.node;
    const title = n.title;
    const id = n.short || (n.id.length > 12 ? n.id.slice(0, 12) + "…" : n.id);
    const st = n.archived ? `<span class="badge arch">archived</span>` : `<span class="${stateClass(n.stateTone || "dim")}">● ${n.state || "idle"}</span>`;
    return `<div class="tree-row ${i === state.treeIndex ? "selected" : ""}" data-tree="${i}">
      <span class="tree-glyph">${r.glyph}</span>
      <span class="tree-name">${esc(title)}<span class="id">${esc(id)}</span>${r.focus ? `<span class="badge" style="margin-left:8px">from sessions</span>` : ""}</span>
      <span class="tree-state">${st}</span>
      <span class="tree-time">${esc(n.updated || "—")}</span>
    </div>`;
  }).join("");

  $("view").innerHTML = `
    <div class="section-title">fork lineage <span class="hint">following the harness's own parent link, not a timestamp guess</span></div>
    <div class="tree">${body}</div>
    <div class="detail">
      <div class="detail-head">lineage of ${esc(root.short || root.id)}</div>
      <div class="detail-body">
        <div class="field"><span class="label">source</span><span class="value">${esc(root.harness)} · ${esc(root.id)}</span></div>
        <div class="field"><span class="label">records</span><span class="value dim">parent_id / fork_session_id · fork_boundary</span></div>
        <div class="field"><span class="label">root</span><span class="value">${root.parent ? `<span class="blue">↳ ${esc(root.parent)}</span>` : `<span class="green">this session</span>`}</span></div>
        <div class="field"><span class="label">children</span><span class="value dim">${root.children.length} fork(s)</span></div>
        <div class="detail-actions"><b>enter</b> open session · <b>esc</b> back to sessions · <b>h</b> hop this branch</div>
      </div>
    </div>
    <div class="note"><b>Only native links are drawn.</b> OpenCode stores <span class="mono">parent_id</span>, <span class="mono">fork_session_id</span> and <span class="mono">fork_boundary</span>; Pi stores <span class="mono">parentSession</span> in the session header. Claude Code and Codex leave no reliable cross-session parent, so the TUI says so instead of inventing an edge.</div>
  `;
  $("crumb").textContent = `/ ${root.harness} / ${root.short || root.id} / lineage`;
  $("keybar").innerHTML = `<span><b>j/k</b> move</span><span><b>enter</b> open</span><span><b>f</b> full tree</span><span><b>h</b> hop</span><span><b>esc</b> back</span><span class="status">${esc(state.status)}</span>`;
}

function renderModal() {
  const s = selectedSession();
  const targets = harnesses.filter((h) => h.id !== s.harness);
  const dest = targets[state.hopDest] || targets[0];
  const html = `<div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-head">hop session</div>
      <div class="modal-body">
        <div class="modal-row"><span class="label">source</span><span><span class="dim">${s.harness}</span> · ${esc(s.title)} <span class="blue">${esc(s.short)}</span></span></div>
        <div class="modal-row"><span class="label">destination</span><span></span></div>
        ${targets.map((h, i) => `<div class="dest ${i === state.hopDest ? "active" : ""}" data-dest="${i}"><span class="radio"></span><span class="hname">${h.label}</span><span class="muted">${h.version} · ${h.sessions} sessions</span><span class="right" style="margin-left:auto;color:var(--green)">ready</span></div>`).join("")}
        <div class="modal-row" style="margin-top:8px"><span class="label">compaction</span><span class="dim">none <span class="muted">›</span> portable <span class="muted">›</span> summary</span></div>
        <div class="modal-row"><span class="label">tools</span><span class="dim">keep historical calls <span class="muted">·</span> reasoning drop_foreign</span></div>
      </div>
      <div class="modal-foot"><span><b>j/k</b> choose</span><span><b>enter</b> hop</span><span><b>esc</b> cancel</span><span style="margin-left:auto" class="muted">writes a new session; source untouched</span></div>
    </div>
  </div>`;
  $("terminal").insertAdjacentHTML("beforeend", html);
  $("overlay").addEventListener("click", (e) => {
    const d = e.target.closest("[data-dest]");
    if (d) { state.hopDest = Number(d.dataset.dest); closeModal(); openModal(); }
    else if (e.target.id === "overlay") closeModal();
  });
}

function openModal() {
  if (!selectedSession()) return;
  state.modal = "hop";
  renderModal();
}

function closeModal() {
  state.modal = null;
  const o = $("overlay");
  if (o) o.remove();
}

function draw() {
  $("summary").innerHTML = summary();
  if (state.screen === "harnesses") renderHarnesses();
  else if (state.screen === "sessions") renderSessions();
  else renderLineage();
}

function toast(text) {
  state.status = text;
  draw();
  setTimeout(() => { state.status = "ready"; draw(); }, 1600);
}

document.addEventListener("click", (e) => {
  const h = e.target.closest("[data-harness]");
  if (h) {
    state.harnessIndex = Number(h.dataset.harness);
    draw();
    return;
  }
  const s = e.target.closest("[data-session]");
  if (s) {
    state.sessionIndex = Number(s.dataset.session);
    draw();
    return;
  }
  const f = e.target.closest("[data-filter]");
  if (f) {
    state.filter = f.dataset.filter;
    state.sessionIndex = 0;
    draw();
    return;
  }
  const t = e.target.closest("[data-tree]");
  if (t) {
    state.treeIndex = Number(t.dataset.tree);
    draw();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.target && e.target.tagName === "INPUT") {
    if (e.key === "Escape") {
      state.filtering = false;
      state.query = "";
      state.sessionIndex = 0;
      draw();
      e.preventDefault();
    }
    return;
  }
  if (state.modal === "hop") {
    const s = selectedSession();
    const targets = harnesses.filter((h) => h.id !== s.harness);
    if (e.key === "Escape") { closeModal(); e.preventDefault(); return; }
    if (e.key === "j" || e.key === "ArrowDown") { state.hopDest = (state.hopDest + 1) % targets.length; closeModal(); openModal(); e.preventDefault(); return; }
    if (e.key === "k" || e.key === "ArrowUp") { state.hopDest = (state.hopDest + targets.length - 1) % targets.length; closeModal(); openModal(); e.preventDefault(); return; }
    if (e.key === "Enter") {
      const dest = targets[state.hopDest];
      closeModal();
      toast(`hop → ${dest.label} · mockup only`);
      e.preventDefault();
    }
    return;
  }

  if (e.key === "q" && state.screen === "harnesses") {
    toast("quit is not implemented in the mockup");
    return;
  }
  if (e.key === "Escape") {
    if (state.filtering || state.query) {
      state.filtering = false;
      state.query = "";
      state.sessionIndex = 0;
      draw();
      e.preventDefault();
      return;
    }
    if (state.screen === "lineage") { state.screen = "sessions"; draw(); }
    else if (state.screen === "sessions") { state.screen = "harnesses"; draw(); }
    e.preventDefault();
    return;
  }
  if (e.key === "/" && state.screen === "sessions") {
    state.filtering = true;
    draw();
    e.preventDefault();
    return;
  }
  if (e.key === "ArrowDown" || e.key === "j") {
    if (state.screen === "harnesses") state.harnessIndex = Math.min(state.harnessIndex + 1, harnesses.length - 1);
    else if (state.screen === "lineage") state.treeIndex = Math.min(state.treeIndex + 1, treeRows().rows.length - 1);
    else state.sessionIndex = Math.min(state.sessionIndex + 1, visibleSessions().length - 1);
    draw(); e.preventDefault(); return;
  }
  if (e.key === "ArrowUp" || e.key === "k") {
    if (state.screen === "harnesses") state.harnessIndex = Math.max(state.harnessIndex - 1, 0);
    else if (state.screen === "lineage") state.treeIndex = Math.max(state.treeIndex - 1, 0);
    else state.sessionIndex = Math.max(state.sessionIndex - 1, 0);
    draw(); e.preventDefault(); return;
  }
  if (e.key === "Tab") {
    if (state.screen === "harnesses") {
      state.harnessIndex = (state.harnessIndex + 1) % harnesses.length;
    } else {
      const order = ["all", ...harnesses.map((h) => h.id)];
      state.filter = order[(order.indexOf(state.filter) + 1) % order.length];
      state.sessionIndex = 0;
    }
    draw(); e.preventDefault(); return;
  }
  if (e.key === "Enter") {
    if (state.screen === "harnesses") {
      state.filter = harnesses[state.harnessIndex].id;
      state.sessionIndex = 0;
      state.screen = "sessions";
    } else if (state.screen === "sessions") {
      const s = selectedSession();
      if (!s) { e.preventDefault(); return; }
      state.lineageRoot = s.parent ? s.parent : s.id;
      state.lineageFocus = s.id;
      state.screen = "lineage";
    } else {
      const node = treeRows().rows[state.treeIndex].node;
      toast(`open ${node.short || node.id} · mockup only`);
    }
    draw(); e.preventDefault(); return;
  }
  if (e.key === "f" && state.screen === "sessions") {
    const s = selectedSession();
    if (!s) { e.preventDefault(); return; }
    state.lineageRoot = s.parent ? s.parent : s.id;
    state.lineageFocus = s.id;
    state.screen = "lineage"; draw(); e.preventDefault(); return;
  }
  if (e.key === "h" && (state.screen === "sessions" || state.screen === "lineage")) { state.hopDest = 0; openModal(); e.preventDefault(); return; }
  if (e.key === "d" && state.screen === "sessions") {
    const s = selectedSession();
    if (s) toast(`dump ${s.short} → interchange document`);
    e.preventDefault(); return;
  }
  if (e.key === "r" && state.screen === "sessions") {
    const s = selectedSession();
    if (s) state.status = "resume · " + (resumeArgs[s.harness] || "none");
    draw(); e.preventDefault(); return;
  }
  if (e.key === "r" && state.screen === "harnesses") { toast("rescanning stores…"); e.preventDefault(); return; }
  if (e.key === "?") { toast("j/k move · enter open · tab harness · / filter · h hop · d dump · r resume · esc back"); e.preventDefault(); }
});

draw();
</script>
</body>
</html>
