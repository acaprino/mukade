<!--
PROTOTYPE MAP (written before the screens). Design artifact, not the app. Sample data only.
Skin: apps/desktop/src/styles.css, copied token for token. No network, no library.

SCREENS
  Chat (the subject)
    Service bar ......... Stop service -> confirm -> stopped screen. Stopped: Start service -> running.
    Rooms column ........ filter rooms; pick a room; New room -> dialog (name rules, duplicate, closed name).
    Stage head .......... Graph | Lanes | Feed; Launch agent -> dialog; Close room -> confirm;
                          closed room: Reopen, Delete -> confirm.
    Filter bar .......... text; member chips; kind chips (messages, signals and turn, system); clear.
    Graph ............... members as plates, the room as hub, lines by kind and count;
                          click a plate -> member in the inspector; scrubber: play, step, pick an event.
    Lanes ............... one lane per member, a wire from sender to recipients; click a row -> select.
    Feed ................ the room as cards; click -> select.
    Composer ............ not joined: Join (name rules) -> joined. Joined: recipients, text, Send
                          (empty, recognized secret, too long -> inline error; loading; sent), Leave.
    Inspector ........... members (state, write turn) -> detail: Mention, Show session, Free write turn;
                          instructions (waiting, overdue, blocked, done) -> select; overdue: Send again.
  Sessions (kept, restated in the same shell)
    Installations, folders, filter, tree with fold, detail with "In rooms" -> jumps to the room.
    Open transcript, Hop, Export, Resume, and the toolbar's Scan folder and Import: unchanged in
    the app and left out here (a note says so in the session pane).
  Everywhere
    Search everything (ctrl+K or /) -> rooms, members, messages, sessions; arrows, Enter.
    Theme; Reload; Reset prototype. Keys: c, 1 2 3, left right, space, n, l, Escape.

STATE (one object, saved in localStorage, restored on reload)
  theme, view, service, room, chatView, sel{room: event}, member, filter{text, members, kinds},
  roomFilter, drafts{room: text}, to{room: [members]}, me{room: member}, dialog{type, fields, errors},
  inst, folder, session, sFilter, folded, rooms, members, events, turns{room: {holder, at}}

FAKED: every wait is a timer; nothing reaches a chat service. "Overdue" and the write turn come from
docs/superpowers/specs/2026-11-16-chat-overdue-write-turn-design.md and are not implemented.
-->

.lrow:hover { background: color-mix(in srgb, var(--surface) 70%, transparent); }
.lrow[aria-current='true'] { border-left-color: var(--accent); background: var(--surface); }
.wire { position: absolute; top: 12px; height: 0; border-top: 1px solid var(--accent); }
.wire.done { border-top: 1px dashed var(--live); } .wire.blocked, .wire.overdue { border-top: 1px dashed var(--warning); } .wire.observe { border-top: 1px dotted var(--muted); }
.wdot { position: absolute; top: 12px; width: 7px; height: 7px; margin: -4px 0 0 -4px; background: var(--accent); }
.warw { position: absolute; top: 12px; width: 0; height: 0; border: 4px solid transparent; margin-top: -4px; }
.warw.r { border-left: 7px solid var(--accent); border-right: 0; margin-left: -7px; } .warw.l { border-right: 7px solid var(--accent); border-left: 0; }
.c-done.wdot { background: var(--live); } .c-done.warw.r { border-left-color: var(--live); } .c-done.warw.l { border-right-color: var(--live); }
.c-blocked.wdot, .c-overdue.wdot { background: var(--warning); } .c-blocked.warw.r, .c-overdue.warw.r { border-left-color: var(--warning); } .c-blocked.warw.l, .c-overdue.warw.l { border-right-color: var(--warning); }
.c-observe.wdot { background: var(--muted); } .c-observe.warw.r { border-left-color: var(--muted); } .c-observe.warw.l { border-right-color: var(--muted); }
.lmsg { position: relative; margin-top: 18px; padding: 6px 9px; border: 1px solid var(--line); background: var(--chrome-2); line-height: 1.5; user-select: text; }
.lmsg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; } .lmsg .to { margin-top: 3px; font: 11px var(--mono); color: var(--muted); }
.lchipwrap { position: relative; margin-top: 2px; height: 20px; }
.lchip { position: absolute; top: 0; transform: translateX(-50%); padding: 0 6px; border: 1px solid var(--line); background: var(--pane); font: 11px/17px var(--mono); color: var(--muted); white-space: nowrap; }
.lchip.k-done { color: var(--live); border-color: currentColor; } .lchip.k-blocked, .lchip.k-overdue { color: var(--warning); border-color: currentColor; } .lchip.k-claim, .lchip.k-release { color: var(--ice); }
.lrow.wired .lchipwrap { margin-top: 18px; }

/* Composer */
.composer { border-top: 1px solid var(--line-strong); background: var(--chrome-2); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
.composer .line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.composer label, .field label { font: 500 11px var(--display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.composer textarea { flex: 1; min-width: 0; height: 58px; }
.composer .hint { font: 12px var(--mono); color: var(--muted); }

/* Inspector */
.mrow { flex-wrap: wrap; row-gap: 0; }
.mrow .state { font: 11px var(--mono); color: var(--muted); } .mrow .state.working { color: var(--live); } .mrow .state.silent { color: var(--warning); }
.mdetail { margin: 0 10px 8px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.irow { align-items: flex-start; padding-top: 6px; padding-bottom: 6px; }
.irow .grow { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.turn { margin: 4px 10px 12px; padding: 9px 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--text-2); }
.turn b { font: 13px var(--mono); font-weight: 400; color: var(--text); }

/* Sessions */
#inst { flex: 0 0 236px; } #sess { flex: 0 0 clamp(320px, 34%, 500px); } #sdetail { flex: 1 1 0; }
#s-filter { flex: 1; min-width: 0; }
.lineage .row { border-bottom: 1px solid var(--line); }

/* Dialogs, palette, toasts */
.scrim { position: fixed; inset: 0; z-index: 20; display: grid; place-items: start center; padding-top: 12vh; background: var(--scrim); backdrop-filter: blur(6px); }
.dialog { width: min(560px, calc(100vw - 32px)); max-height: 76vh; display: flex; flex-direction: column; border: 1px solid var(--line-strong); border-top: 2px solid var(--accent); background: var(--chrome-2); background-image: var(--specular); background-repeat: no-repeat; box-shadow: 0 24px 60px var(--shadow); }
.dialog-head { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 5px 12px; border-bottom: 1px solid var(--line); background-image: var(--sheen-soft); box-shadow: var(--edge); }
.dialog-head h2 { margin: 0; font: 500 12px var(--display); letter-spacing: .07em; text-transform: uppercase; }
.dialog-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); background-image: var(--sheen-soft); box-shadow: var(--edge); }
.field { display: flex; flex-direction: column; gap: 4px; } .field input, .field select { width: 100%; }
.fields { display: flex; flex-wrap: wrap; gap: 12px; } .fields > * { flex: 1 1 160px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.choice { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--selection); }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
#palette-input { width: 100%; min-height: 34px; font-size: 14px; }
.pres { max-height: 46vh; overflow: auto; margin: 0 -14px -14px; border-top: 1px solid var(--line); }
.pres .label { padding-top: 8px; }
.toasts { position: fixed; right: 14px; bottom: 40px; z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.toast { padding: 8px 12px; border: 1px solid var(--line-strong); border-left: 2px solid var(--live); background: var(--chrome-2); box-shadow: 0 10px 30px var(--shadow); animation: rise var(--slow) var(--ease-out); }
.toast.bad { border-left-color: var(--error); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (max-width: 1099px) { #inspector { flex-basis: 268px; } #rooms { flex-basis: 220px; } }

  #app { grid-template-rows: 34px auto minmax(0, 1fr) 28px; } .toolbar { flex-wrap: wrap; padding: 6px 10px; } .tabs { align-self: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* lanes */
function lanesHTML(shown, sel) {
  const ms = roomMembers(), n = ms.length, c = (i) => ((i + .5) / n) * 100, ix = (id) => ms.findIndex((m) => m.id === id);
  const life = ms.map((m, i) => `<i class="life" style="left:${c(i)}%"></i>`).join('');
  const row = (e) => {
    let a = ix(e.kind === 'overdue' ? e.target : e.actor), rec = [], k = e.kind === 'signal' ? e.signal : e.kind;
    if (e.kind === 'message') rec = e.to.length ? e.to.map(ix) : ms.map((_, i) => i).filter((i) => i !== a);
    else if (e.kind === 'signal' || e.kind === 'overdue') rec = [ix(S.events.find((x) => x.id === e.ref)?.actor)];
    else if (e.kind === 'observe') rec = [ix(e.target)];
    else if (e.kind === 'release' && a < 0) a = ix(e.target);
    rec = rec.filter((i) => i >= 0);
    const lo = Math.min(a, ...rec), hi = Math.max(a, ...rec), kc = e.kind === 'message' ? '' : ' c-' + k;
    const wire = a >= 0 && rec.length ? `<span class="wire ${e.kind === 'message' ? '' : k}" style="left:${c(lo)}%;width:${c(hi) - c(lo)}%"></span><span class="wdot${kc}" style="left:${c(a)}%"></span>${rec.map((i) => `<span class="warw ${i > a ? 'r' : 'l'}${kc}" style="left:${c(i)}%"></span>`).join('')}` : '';
    let body;
    if (e.kind === 'message') { const w = Math.max(c(hi) - c(lo), 46), left = Math.max(0, Math.min(c(lo) - 3, 100 - w)); body = `<div class="lmsg" style="margin-left:${left}%;width:${w}%"><p>${rich(e.text)}</p><div class="to">#${e.id} · ${esc(mem(e.actor).name)} to ${e.to.length ? e.to.map((x) => esc(mem(x).name)).join(', ') : 'everyone'}</div></div>`; }
    else { const text = { join: `joined · ${mem(e.actor)?.role}`, leave: 'left', open: 'opened the room', close: 'closed the room', reopen: 'reopened the room', observe: `observes ${mem(e.target)?.name}`, signal: `${e.signal} · #${e.ref}`, overdue: `silent on #${e.ref}`, claim: 'took the write turn', release: e.reason === 'released' ? 'released the turn' : `turn freed: ${e.reason}` }[e.kind];
      body = `<div class="lchipwrap"><span class="lchip k-${k}" style="left:clamp(66px, ${a >= 0 ? c(a) : 50}%, calc(100% - 66px))">${esc((a < 0 ? actorName(e.actor) + ' ' : '') + text)}</span></div>`; }
    return `<div class="lrow${wire && e.kind !== 'message' ? ' wired' : ''}" data-act="sel" data-id="${e.id}" tabindex="0" role="button" aria-current="${e.id === sel}" aria-label="${esc(`${e.t}, ${e.kind === 'message' ? actorName(e.actor) + ': ' + e.text : describe(e)}`)}"><time>${e.t}</time><div class="larea">${life}${wire}${body}</div></div>`;
  };
  return `<div class="lanes"><div class="lhead"><time></time><div class="larea">${ms.map((m, i) => `<div class="lname" style="left:${c(i)}%"><span>${glyph(m.harness)}${esc(m.name)}</span><small>${m.role}</small></div>`).join('')}</div></div>${shown.map(row).join('')}</div>`;
}

function results() {
  const d = S.dialog, q = (d.q ?? '').trim().toLowerCase(), sc = d.scope ?? 'all', out = [], want = (s) => sc === 'all' || sc === s, cap = sc === 'all' ? 5 : 30;
  const push = (g, items) => { if (want(g) && items.length) out.push({ g, items: items.slice(0, cap), more: Math.max(0, items.length - cap) }); };
  push('rooms', S.rooms.filter((r) => r.name.includes(q)).map((r) => ({ label: r.name, sub: r.open ? 'open' : 'closed', go: { room: r.id } })));
  push('members', S.members.filter((m) => !q || m.name.includes(q) || HARNESS[m.harness].label.toLowerCase().includes(q) || m.role.includes(q)).map((m) => ({ label: m.name, h: m.harness, sub: `${m.role} · ${room(m.room).name}`, go: { room: m.room, member: m.id } })));
  if (q) push('messages', S.events.filter((e) => e.kind === 'message' && e.text.toLowerCase().includes(q)).map((e) => ({ label: e.text, h: mem(e.actor).harness, sub: `${mem(e.actor).name} · ${room(e.room).name} · ${e.t}`, go: { room: e.room, ev: e.id } })));
  push('sessions', SESS.filter((s) => !q || s.title.toLowerCase().includes(q) || s.sid.includes(q)).map((s) => ({ label: s.title, h: s.inst, sub: `${HARNESS[s.inst].label} · ${s.time}`, go: { sess: s.id } })));
  return out;
}
function paintResults() {
  const el = $('#pres'); if (!el) return;
  const groups = results(), flat = groups.flatMap((g) => g.items); pIndex = Math.max(0, Math.min(pIndex, flat.length - 1)); let i = 0;
  el.innerHTML = flat.length ? groups.map((g) => `<p class="label">${g.g}${g.more ? ` · ${g.more} more, narrow the search` : ''}</p><ul class="list">${g.items.map((it) => { const n = i++; return `<li><button type="button" class="row" role="option" data-act="pgo" data-id="${n}" aria-selected="${n === pIndex}">${it.h ? glyph(it.h) : icon('chat')}<span class="grow">${esc(it.label)}</span><span class="num">${esc(it.sub)}</span></button></li>`; }).join('')}</ul>`).join('')
    : `<p class="label">Nothing matches “${esc(S.dialog.q ?? '')}”${(S.dialog.scope ?? 'all') !== 'all' ? ` in ${S.dialog.scope}` : ''}.</p>`;
  $('[aria-selected="true"]', el)?.scrollIntoView({ block: 'nearest' });
}
function go(g) {
  S.dialog = null;
  if (g.sess) { const s = SESS.find((x) => x.id === g.sess); S.view = 'sessions'; S.inst = s.inst; S.folder = ''; S.sFilter = ''; S.session = s.id; if (s.parent) S.folded = S.folded.filter((x) => x !== s.parent); }
  else { S.view = 'chat'; S.room = g.room; S.filter = { text: '', members: [], kinds: ['message', 'signal', 'system'] }; if (g.member) S.member = g.member; if (g.ev) { S.sel[g.room] = g.ev; if (S.chatView === 'graph') S.chatView = 'feed'; } if (S.service !== 'running') status('the chat service is stopped'); }
}
function closeDialog() { S.dialog = null; busy.dlg = false; paint(); if (opener) document.querySelector(opener)?.focus(); opener = null; }
function openDialog(d, from) { opener = from ?? null; pIndex = 0; S.dialog = d; paint(); }

/* ---------- actions ---------- */
const later = (ms, fn) => setTimeout(() => { fn(); paint(); }, ms);
function stopPlay() { clearInterval(playing); playing = null; }
function step(by) { const evs = roomEvents(), i = evs.findIndex((e) => e.id === selId()) + by; if (i < 0 || i >= evs.length) return false; S.sel[S.room] = evs[i].id; return true; }
const ACT = {
  view: (d) => { S.view = d.id; }, theme: () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; },
  reload: () => { if (busy.reload) return; busy.reload = true; status('reading the stores and the chat service…'); later(700, () => { busy.reload = false; status('read again · nothing changed'); }); },
  reset: () => { stopPlay(); S = seed(); busy = {}; status('sample data restored'); },
  room: (d) => { stopPlay(); S.room = d.id; S.member = null; S.dialog = null; }, cv: (d) => { stopPlay(); S.chatView = d.id; },
  sel: (d) => { stopPlay(); S.sel[S.room] = Number(d.id); const e = S.events.find((x) => x.id === Number(d.id)); if (e && !visible(e)) S.filter = { text: '', members: [], kinds: ['message', 'signal', 'system'] }; },
  member: (d) => { S.member = S.member === d.id ? null : d.id; },
  fmember: (d) => { const f = S.filter.members; S.filter.members = f.includes(d.id) ? f.filter((x) => x !== d.id) : [...f, d.id]; },
  fkind: (d) => { const k = S.filter.kinds; S.filter.kinds = k.includes(d.id) ? k.filter((x) => x !== d.id) : [...k, d.id]; },
  fclear: () => { S.filter = { text: '', members: [], kinds: ['message', 'signal', 'system'] }; },
  play: () => { if (playing) return stopPlay(); if (!step(1)) S.sel[S.room] = roomEvents()[0].id; playing = setInterval(() => { if (!step(1)) stopPlay(); paint(); }, 1100); },
  prev: () => { stopPlay(); step(-1); }, next: () => { stopPlay(); step(1); },
  to: (d) => { const t = S.to[S.room] ?? []; S.to[S.room] = d.id === 'all' ? [] : t.includes(d.id) ? t.filter((x) => x !== d.id) : [...t, d.id]; },
  mention: (d) => { const n = '@' + mem(d.id).name + ' ', cur = S.drafts[S.room] ?? ''; S.drafts[S.room] = cur + (cur && !cur.endsWith(' ') ? ' ' : '') + n; setTimeout(() => { const t = $('#draft'); t?.focus(); t?.setSelectionRange(t.value.length, t.value.length); }); },
  again: (d) => { const e = S.events.find((x) => x.id === Number(d.id)); if (!S.me[S.room]) { status('join the room as lead to send it again'); toast('Join the room first: the window writes as a member.', true); return; } S.drafts[S.room] = e.text; S.to[S.room] = e.to.slice(); setTimeout(() => $('#draft')?.focus()); },
  showsession: (d) => { const s = SESS.find((x) => x.sid === mem(d.id).session); go({ sess: s.id }); },
  goroom: (d) => { const m = mem(d.id); go({ room: m.room, member: m.id }); },
  join: () => {
    const name = $('#join-name').value.trim(), role = $('#join-role').value; S.drafts['join:' + S.room] = { name, role };
    busy.joinErr = !NAME.test(name) || name === 'all' ? 'A name is 1 to 32 lowercase letters, digits, - or _, and cannot be “all”.' : roomMembers().some((m) => m.name === name) ? `${name} is already a member of this room. Names are never reused in a room.` : null;
    if (busy.joinErr) { setTimeout(() => $('#join-name')?.focus()); return; }
    busy.join = true; const r = S.room;
    later(500, () => { busy.join = false; const id = 'm' + ++S.mseq; S.members.push({ id, room: r, name, harness: 'desktop', role, session: null, cwd: null, status: 'listening', progress: now(), evidence: 'bus', left: false }); S.me[r] = id; addEvent(r, 'join', id); status(`joined ${room(r).name} as ${name}`); setTimeout(() => $('#draft')?.focus()); });
  },
  leave: () => { const id = S.me[S.room]; mem(id).left = true; delete S.me[S.room]; addEvent(S.room, 'leave', id); status('left the room'); },
  send: () => {
    const r = S.room, me = mem(S.me[r]), text = ($('#draft')?.value ?? '').trim(), m = text.match(SECRET);
    busy.sendErr = !text ? 'Write a message first.' : m ? `The service refuses a recognized secret (${m[0].slice(0, 6)}…). Nothing was sent.` : new Blob([text]).size > 65536 ? 'A message is at most 65,536 bytes.' : null;
    if (busy.sendErr) { setTimeout(() => $('#draft')?.focus()); return; }
    busy.send = true;
    later(500, () => {
      busy.send = false; let to = (S.to[r] ?? []).slice(), all = false;
      text.replace(/(^|[^A-Za-z0-9_@.-])@([a-z0-9][a-z0-9_-]{0,31})/g, (_, p, n) => { if (n === 'all') all = true; const x = roomMembers(r).find((y) => y.name === n && !y.left && y.id !== me.id); if (x && !to.includes(x.id)) to.push(x.id); });
      if (all) to = []; me.progress = now();
      addEvent(r, 'message', me.id, { to, text }); S.drafts[r] = ''; S.to[r] = [];
      status(`sent to ${to.length ? to.map((x) => mem(x).name).join(', ') : 'everyone'}`); setTimeout(() => $('#draft')?.focus());
    });
  },
  newroom: (d, el) => openDialog({ type: 'newroom', name: '' }, '#new-room'),
  launch: () => openDialog({ type: 'launch', harness: 'codex', role: 'worker', listen: 600, cwd: 'C:\\work\\mukade' }, '#launch'),
  closeroom: () => openDialog({ type: 'confirm', what: 'closeroom', room: S.room }, '#close-room'),
  delroom: () => openDialog({ type: 'confirm', what: 'delroom', room: S.room }, '#del-room'),
  svcstop: () => openDialog({ type: 'confirm', what: 'svcstop' }, '#svc-stop'),
  freeturn: () => openDialog({ type: 'confirm', what: 'freeturn', room: S.room }, '#free-turn'),
  reopen: () => { const r = room(); r.open = true; addEvent(r.id, 'reopen', 'user'); status(`${r.name} reopened`); },
  svcstart: () => { busy.svc = true; status('starting the chat service…'); later(900, () => { busy.svc = false; S.service = 'running'; status('chat service running'); toast('The chat service is running.'); }); },
  palette: () => openDialog({ type: 'palette', q: '', scope: 'all' }, '#palette-open'),
  pscope: (d) => { S.dialog.scope = d.id; pIndex = 0; setTimeout(() => $('#palette-input')?.focus()); },
  pgo: (d) => { const it = results().flatMap((g) => g.items)[Number(d.id)]; if (it) go(it.go); },
  'dlg-cancel': () => closeDialog(), 'dlg-scrim': (d, el, ev) => { if (ev.target === el && !busy.dlg) closeDialog(); },
  'dlg-ok': () => {
    const d = S.dialog;
    if (d.type === 'newroom') {
      const name = (d.name ?? '').trim(), ex = S.rooms.find((r) => r.name === name); d.go = null;
      d.err = !ROOM.test(name) ? 'A room name is 1 to 64 lowercase letters, digits, - or _, starting with a letter or digit.' : ex?.open ? `A room named ${name} is already open.` : ex ? `${name} is closed. Reopen it instead of opening a new one.` : null;
      if (ex) d.go = ex.id; if (d.err) { setTimeout(() => $('#f-name')?.focus()); return; }
      busy.dlg = true; later(400, () => { busy.dlg = false; const id = 'r' + ++S.seq; S.rooms.unshift({ id, name, open: true, day: now() }); addEvent(id, 'open', 'user'); S.room = id; S.member = null; S.dialog = null; status(`room ${name} opened`); toast(`Room ${name} is open. Launch an agent into it.`); });
    } else if (d.type === 'launch') {
      const n = Number(d.listen);
      d.errListen = d.listen === '' || !Number.isInteger(n) || n < 0 || n > 3600 ? 'Whole seconds, from 0 to 3600.' : null;
      d.errCwd = !/^([A-Za-z]:\\|\/)/.test(d.cwd.trim()) ? 'Give an absolute folder, such as C:\\work\\mukade.' : null;
      if (d.errListen || d.errCwd) { setTimeout(() => $(d.errListen ? '#f-listen' : '#f-cwd')?.focus()); return; }
      busy.dlg = true; status('opening a terminal…'); const r = S.room;
      later(1200, () => { busy.dlg = false; const base = d.harness === 'claude_code' ? 'claude' : d.harness, taken = roomMembers(r).map((m) => m.name); let k = 1; while (taken.includes(`${base}-${k}`)) k++;
        const id = 'm' + ++S.mseq, name = `${base}-${k}`; S.members.push({ id, room: r, name, harness: d.harness, role: d.role, session: null, cwd: d.cwd.trim(), status: 'listening', progress: now(), evidence: 'bus', left: false });
        addEvent(r, 'join', id); S.member = id; S.dialog = null; status(`${name} joined ${room(r).name}`); toast(`${name} joined ${room(r).name} as ${d.role}.`); });
    } else {
      busy.dlg = true; const r = room(d.room), what = d.what;
      later(what === 'svcstop' ? 600 : 350, () => { busy.dlg = false; S.dialog = null;
        if (what === 'closeroom') { const t = S.turns[r.id]; r.open = false; if (t) { addEvent(r.id, 'release', 'service', { target: t.holder, reason: 'closed' }); delete S.turns[r.id]; } addEvent(r.id, 'close', 'user'); status(`${r.name} closed`); }
        if (what === 'delroom') { S.rooms = S.rooms.filter((x) => x.id !== r.id); S.events = S.events.filter((e) => e.room !== r.id); S.members = S.members.filter((m) => m.room !== r.id); S.room = S.rooms[0]?.id ?? null; S.member = null; status(`${r.name} deleted`); toast(`Room ${r.name} was deleted.`); }
        if (what === 'svcstop') { stopPlay(); S.service = 'stopped'; status('chat service stopped'); }
        if (what === 'freeturn') { const t = S.turns[r.id]; addEvent(r.id, 'release', 'service', { target: t.holder, reason: 'forced' }); delete S.turns[r.id]; status('write turn freed'); toast(`The write turn of ${mem(t.holder).name} is free.`); }
      });
    }
  },
  inst: (d) => { S.inst = d.id; S.folder = ''; S.session = null; }, folder: (d) => { S.folder = d.id; }, sess: (d) => { S.session = d.id; },
  fold: (d) => { S.folded = S.folded.includes(d.id) ? S.folded.filter((x) => x !== d.id) : [...S.folded, d.id]; },
};
function run(name, el, ev) { const fn = ACT[name]; if (!fn) return; fn(el?.dataset ?? {}, el, ev); paint(); }

document.addEventListener('click', (ev) => { const el = ev.target.closest('[data-act]'); if (el && !el.disabled) run(el.dataset.act, el, ev); });
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'draft') { S.drafts[S.room] = t.value; if (busy.sendErr) { busy.sendErr = null; $('#draft-err').textContent = ''; t.setAttribute('aria-invalid', 'false'); } }
  else if (t.id === 'msg-filter') { S.filter.text = t.value; paintStageBody(); }
  else if (t.id === 'room-filter') { S.roomFilter = t.value; paintRooms(); }
  else if (t.id === 's-filter') { S.sFilter = t.value; paintSessions(); const f = $('#s-filter'); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  else if (t.id === 'palette-input') { S.dialog.q = t.value; pIndex = 0; paintResults(); }
  else if (t.id === 'join-name' || t.id === 'join-role') { S.drafts['join:' + S.room] = { name: $('#join-name').value, role: $('#join-role').value }; }
  else if (t.dataset.f && S.dialog) { S.dialog[t.dataset.f] = t.value; if (S.dialog.type === 'launch') { const d = S.dialog; $('#launch-cmd').textContent = `mukade chat launch ${d.harness} --room ${room().name}${d.role !== 'peer' ? ' --role ' + d.role : ''} --listen ${d.listen || 0}`; } }
  save();
});
document.addEventListener('keydown', (ev) => {
  const t = ev.target, typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName), k = ev.key;
  if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === 'k') { ev.preventDefault(); if (S.dialog?.type !== 'palette') run('palette'); return; }
  if (S.dialog) {
    if (k === 'Escape' && !busy.dlg) { ev.preventDefault(); closeDialog(); return; }
    if (S.dialog.type === 'palette' && (k === 'ArrowDown' || k === 'ArrowUp')) { ev.preventDefault(); pIndex += k === 'ArrowDown' ? 1 : -1; paintResults(); return; }
    if (k === 'Enter' && t.tagName !== 'BUTTON' && t.tagName !== 'TEXTAREA') { ev.preventDefault(); if (S.dialog.type === 'palette') run('pgo', { dataset: { id: pIndex } }); else if (!busy.dlg) run('dlg-ok'); return; }
    if (k === 'Tab') { const f = [...$('#dialog-host').querySelectorAll('button:not(:disabled), input, select')], i = f.indexOf(document.activeElement); ev.preventDefault(); f[(i + (ev.shiftKey ? -1 : 1) + f.length) % f.length]?.focus(); }
    return;
  }
  if (t.id === 'draft' && k === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); if (!busy.send) run('send'); return; }
  if (t.id === 'join-name' && k === 'Enter') { ev.preventDefault(); if (!busy.join) run('join'); return; }
  if (typing) { if (k === 'Escape') t.blur(); return; }
  if ((k === 'Enter' || k === ' ') && t.dataset?.act && t.tagName !== 'BUTTON') { ev.preventDefault(); run(t.dataset.act, t, ev); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (k === '/') { ev.preventDefault(); run('palette'); }
  else if (k === 'c') run('view', { dataset: { id: S.view === 'chat' ? 'sessions' : 'chat' } });
  else if (k === 'r') run('reload');
  else if (S.view === 'chat' && S.service === 'running') {
    if ('123'.includes(k)) run('cv', { dataset: { id: ['graph', 'lanes', 'feed'][k - 1] } });
    else if (k === 'ArrowLeft') { ev.preventDefault(); run('prev'); } else if (k === 'ArrowRight') { ev.preventDefault(); run('next'); }
    else if (k === ' ' && t.tagName !== 'BUTTON' && S.chatView === 'graph') { ev.preventDefault(); run('play'); }
    else if (k === 'n') run('newroom'); else if (k === 'l' && room()?.open) run('launch');
  }
});

/* self-check: the rules the prototype shows (run with ?selfcheck in the address) */
if (location.search.includes('selfcheck')) {
  const s = seed(), keep = S; S = s;
  console.assert(instructions('r-hop').map((i) => i.state).join() === 'done,overdue', 'instruction states');
  console.assert(NAME.test('codex-b') && !NAME.test('Codex') && ROOM.test('hop-review') && !ROOM.test('-x'), 'name rules');
  console.assert(SECRET.test('key sk-abcdefghijklmnop1234') && !SECRET.test('ask-me'), 'secret rule');
  console.assert(segments(s.events.find((e) => e.id === 7))[0].b === 'm1', 'a signal goes to the instruction author');
  S = keep; console.log('selfcheck done');
}
addEventListener('resize', () => { if (S.view === 'chat' && S.service === 'running' && S.chatView === 'graph') paintStageBody(true); });
paint();
</script>
